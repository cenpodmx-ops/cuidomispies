    <ellipse cx="-70" cy="0" rx="55" ry="40" fill="none" stroke="#FAFAF7" stroke-width="2" opacity="0.5"/>
    <ellipse cx="20" cy="-40" rx="50" ry="35" fill="none" stroke="#A9C5B5" stroke-width="20"/>
    <ellipse cx="20" cy="-40" rx="50" ry="35" fill="none" stroke="#FAFAF7" stroke-width="2" opacity="0.5"/>
    <ellipse cx="60" cy="60" rx="45" ry="32" fill="none" stroke="url(#accentGrad)" stroke-width="18"/>
    <ellipse cx="60" cy="60" rx="45" ry="32" fill="none" stroke="#FAFAF7" stroke-width="2" opacity="0.5"/>
  </g>
  
  <text x="300" y="555" text-anchor="middle" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="22" font-weight="600" fill="#24302F">Anillos Protectores</text>
