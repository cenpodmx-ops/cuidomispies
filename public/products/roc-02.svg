    <circle cx="0" cy="0" r="32" fill="url(#accentGrad)" opacity="0.92"/>
    <circle cx="0" cy="0" r="32" fill="none" stroke="#24302F" stroke-opacity="0.12" stroke-width="2"/>
    <ellipse cx="-10" cy="-10" rx="10" ry="8" fill="#FAFAF7" fill-opacity="0.5"/>
    <circle cx="-60" cy="-30" r="3" fill="#D99C5C" opacity="0.3"/>
    <circle cx="60" cy="-30" r="3" fill="#D99C5C" opacity="0.3"/>
    <circle cx="-60" cy="30" r="3" fill="#D99C5C" opacity="0.3"/>
    <circle cx="60" cy="30" r="3" fill="#D99C5C" opacity="0.3"/>
  </g>
  
  <text x="300" y="555" text-anchor="middle" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="22" font-weight="600" fill="#24302F">Protector Punto Gel</text>
